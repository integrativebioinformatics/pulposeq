name: "validate_bambu_outputs"
description: Transcript-level PCA and expression heatmap for every quantified model and for the curated transcriptome, from Bambu counts or, when oarfish ran, oarfish counts; and the curation yield as a table.
keywords:
  - bambu
  - pca
  - heatmap
  - quantification
  - curation
tools:
  - r:
      description: R statistical computing environment.
      homepage: https://www.r-project.org/
      licence: ["GPL-2.0-or-later"]
  - bambu:
      description: Context-aware transcript quantification from long-read RNA-seq data.
      homepage: https://bioconductor.org/packages/bambu/
      licence: ["GPL-3.0-or-later"]
  - summarizedexperiment:
      description: Container for matrix-like assay data with row and column annotations.
      homepage: https://bioconductor.org/packages/SummarizedExperiment/
      licence: ["Artistic-2.0"]

input:
  - se_rds:
      type: file
      description: Transcript-level SummarizedExperiment from Bambu.
      pattern: "se_multiSample.rds"
  - se_gene_rds:
      type: file
      description: Gene-level SummarizedExperiment from Bambu.
      pattern: "seGene_multiSample.rds"
  - counts_transcript_validated:
      type: file
      description: Validated transcript counts; column one supplies the transcript IDs to keep.
      pattern: "*.txt"
  - counts_gene_validated:
      type: file
      description: Validated gene counts; column one supplies the gene IDs to keep.
      pattern: "*.txt"
  - oarfish_counts:
      type: file
      description: oarfish transcript counts for every model it quantified. An empty list unless oarfish ran.
      pattern: "oarfish_counts_transcript.txt"
  - oarfish_counts_gene:
      type: file
      description: oarfish gene counts for every gene. An empty list unless oarfish ran.
      pattern: "oarfish_counts_gene.txt"
  - oarfish_cpm:
      type: file
      description: oarfish transcript CPM for every model. An empty list unless oarfish ran; when given, the plots and the yield use oarfish's counts.
      pattern: "oarfish_CPM_transcript.txt"
  - r_script:
      type: file
      description: The validate_bambu_out.R script staged from `bin/`.
      pattern: "validate_bambu_out.R"

output:
  - pca_all:
      type: file
      description: PCA over every model the expression source quantified.
      pattern: "pca_all_models.png"
  - pca_grouped_all:
      type: file
      description: PCA over every quantified model, coloured by group.
      pattern: "pca_grouped_all_models.png"
  - h_transcript_all:
      type: file
      description: Sample-by-sample Spearman correlation heatmap over every quantified model.
      pattern: "heatmap_transcript_all_models.png"
  - pca:
      type: file
      description: PCA over the curated transcriptome.
      pattern: "pca_validated.png"
  - pca_grouped:
      type: file
      description: PCA over the curated transcriptome, coloured by group.
      pattern: "pca_grouped_validated.png"
  - h_transcript:
      type: file
      description: Sample-by-sample Spearman correlation heatmap over the curated transcriptome.
      pattern: "heatmap_transcript_validated.png"
  - rds_transcript:
      type: file
      description: Transcript-level SummarizedExperiment subset to the curated features.
      pattern: "se_multiSample_validated.rds"
  - rds_gene:
      type: file
      description: Gene-level SummarizedExperiment subset to the curated features.
      pattern: "seGene_multiSample_validated.rds"
  - validation_summary:
      type: file
      description: >-
        The curation yield, one row per feature type, with columns feature_type,
        curated_set, total_quantified, extended_annotations, recovery and
        expression_source. Recovery is measured against the features with any counts
        in the expression source (Bambu, or oarfish when it ran) rather than against
        the extended annotation, so features no read supports are not counted as
        losses.
      pattern: "validation_summary.csv"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"

authors:
  - "@borgessbarbara"
