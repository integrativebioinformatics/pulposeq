# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "restrander"
description: "Orient long-read cDNA reads so that read strand matches RNA strand, using polyA/polyT tails and the protocol's primers."
keywords:
  - "strandedness"
  - "long-read"
  - "cDNA"
  - "nanopore"
  - "artefact-removal"
tools:
  - "restrander":
      description: |
        Parses a FASTQ, infers each read's orientation from polyA/polyT tails and
        the TSO/RTP primers of the sequencing protocol, and reverse-complements
        reverse-strand reads so every read in the output matches the orientation of
        the original transcript. Reads whose orientation cannot be determined are
        written to a separate FASTQ; artefactual reads (TSO-TSO, RTP-RTP) are
        counted in the report but retained in the main output.
      homepage: "https://github.com/mritchielab/restrander"
      documentation: "https://github.com/jakob-schuster/restrander-vignette"
      tool_dev_url: "https://github.com/mritchielab/restrander"
      doi: "10.1093/nargab/lqad108"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', group:'LUAD' ]
    - reads:
        type: file
        description: |
          Raw long-read cDNA reads, before any end trimming. Restrander locates
          primers and polyA/polyT tails at the read ends, so it must run before
          Chopper's headcrop/tailcrop.
        pattern: "*.{fq,fastq,fq.gz,fastq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930"
  - - custom_config:
        type: file
        description: |
          Optional Restrander configuration JSON, supplied via --restrand_config for
          protocols the shipped presets do not cover. Pass an empty list to resolve
          the preset named by --restrand_kit from inside the container instead.
        pattern: "*.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464"

output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', group:'LUAD' ]
      - restranded_fastq:
          type: file
          description: |
            Oriented reads. Every read now matches the orientation of the transcript
            it came from, which is what makes minimap2's -uf preset and Bambu's
            stranded = TRUE true statements about the data rather than assumptions.
          pattern: "*.restranded.fastq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"

  stats:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', group:'LUAD' ]
      - stats_json:
          type: file
          description: |
            Restrander's own report, captured from stdout. Carries totalReads,
            strandStats ("+", "-" and "?" counts) and artefactStats by class. The
            workflow parses this to derive the oriented fraction, which decides
            whether the run proceeds as stranded.
          pattern: "*.restrander_stats.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464"

  unknown:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', group:'LUAD' ]
      - unknown_fastq:
          type: file
          description: |
            Reads whose orientation could not be determined, diverted here rather
            than passed on with an arbitrary strand. Published so the loss is
            visible instead of silent. Optional: absent when every read was
            orientable.
          pattern: "*.restranded-unknowns.fastq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"

  config_used:
    - config_json:
        type: file
        description: |
          The configuration that was actually resolved and used, copied out of the
          container. It carries the primer sequences behind every orientation call,
          so a run is not reconstructable without it.
        pattern: "*.restrander_config.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464"

  versions:
    - versions_yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@borgessbarbara"
maintainers:
  - "@borgessbarbara"
