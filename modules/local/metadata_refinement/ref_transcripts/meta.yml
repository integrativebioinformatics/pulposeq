name: "ref_transcripts"
description: Annotate and classify known (reference-matching) transcripts from Bambu output using metadata read directly from the supplied reference annotation GTF, producing separate lncRNA and protein-coding GTFs and metadata tables.
keywords:
  - reference-transcripts
  - lncRNA
  - protein-coding
  - annotation
  - gtf
  - ensembl
  - gencode
tools:
  - r-base:
      description: The R Project for Statistical Computing.
      homepage: https://www.r-project.org/
      documentation: https://cran.r-project.org/manuals.html
      licence: ["GPL-2.0-or-later"]
  - bioconductor-rtracklayer:
      description: R interface to genome annotation files and the UCSC genome browser.
      homepage: https://bioconductor.org/packages/release/bioc/html/rtracklayer.html
      licence: ["Artistic-2.0"]

input:
  - transcript_counts:
      type: file
      description: Transcript-level read counts from Bambu.
      pattern: "*.txt"
  - gene_counts:
      type: file
      description: Gene-level read counts from Bambu.
      pattern: "*.txt"
  - gtf_file:
      type: file
      description: GTF file with all transcripts (known + novel) from Bambu.
      pattern: "*.gtf"
  - annotation:
      type: file
      description: Reference annotation GTF (Ensembl or GENCODE) supplying transcript metadata.
      pattern: "*.gtf"
  - r_script:
      type: file
      description: Executable R script for known transcripts annotation.
      pattern: "ref_transcripts.R"
  - gtf_utils:
      type: file
      description: Shared R helpers for reading metadata from the reference annotation.
      pattern: "gtf_annotation_utils.R"

output:
  - transcriptome_metadata:
      type: file
      description: Metadata CSV for the full annotated transcriptome.
      pattern: "annotated_transcriptome_metadata.csv"
  - lncrna_metadata:
      type: file
      description: Metadata CSV for annotated lncRNA transcripts.
      pattern: "annotated_lncRNAs_metadata.csv"
  - lncrna_exonlength:
      type: file
      description: Exon length distribution for annotated lncRNA transcripts.
      pattern: "annotated_lncRNAs_exonlength.csv"
  - protein_coding_metadata:
      type: file
      description: Metadata CSV for annotated protein-coding transcripts.
      pattern: "annotated_protein-coding_metadata.csv"
  - protein_coding_exonlength:
      type: file
      description: Exon length distribution for annotated protein-coding transcripts.
      pattern: "annotated_protein-coding_exonlength.csv"
  - annotated_transcriptome_gtf:
      type: file
      description: GTF of the full annotated transcriptome.
      pattern: "bambu_annotated_transcriptome.gtf"
  - annotated_tx_counts:
      type: file
      description: Transcript-level counts for annotated transcripts.
      pattern: "bambu_annotated_transcriptome_tx_counts.csv"
  - annotated_lncrna_gtf:
      type: file
      description: GTF containing annotated lncRNA transcripts.
      pattern: "bambu_annotated_lncRNAs.gtf"
  - annotated_mrna_gtf:
      type: file
      description: GTF containing annotated protein-coding transcripts.
      pattern: "bambu_annotated_mRNAs.gtf"
  - annotated_gene_counts:
      type: file
      description: Gene-level counts for annotated transcripts.
      pattern: "bambu_annotated_transcriptome_gene_counts.csv"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"

authors:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"
maintainers:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"