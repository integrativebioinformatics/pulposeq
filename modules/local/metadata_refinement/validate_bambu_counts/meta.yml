name: "validate_bambu_counts"
description: Validate Bambu transcript and gene count matrices against novel transcript metadata, retaining only features with IDs present in the classification results.
keywords:
  - validation
  - bambu
  - transcript-filtering
  - novel-transcripts
  - counts
tools:
  - awk:
      description: Pattern scanning and processing language.
      homepage: https://www.gnu.org/software/gawk/
      licence: ["GPL-3.0-or-later"]
  - bash:
      description: GNU Bourne-Again SHell.
      homepage: https://www.gnu.org/software/bash/
      licence: ["GPL-3.0-or-later"]

input:
  - metadata_csv:
      type: file
      description: CSV file with novel transcript metadata from the classification step (contains qry_id column used for validation).
      pattern: "*.csv"
  - counts_gene:
      type: file
      description: subset gene-level read counts from Bambu.
      pattern: "*.txt"
  - counts_transcript:
      type: file
      description: subset transcript-level read counts from Bambu.
      pattern: "*.txt"
  - cpm_transcript:
      type: file
      description: subset transcript-level CPM values from Bambu.
      pattern: "*.txt"
  - full_length_counts_transcript:
      type: file
      description: subset full-length transcript counts from Bambu.
      pattern: "*.txt"
  - unique_counts_transcript:
      type: file
      description: subset unique read counts per transcript from Bambu.
      pattern: "*.txt"

output:
  - counts_gene_validated:
      type: file
      description: Gene-level counts validated against novel transcript metadata.
      pattern: "BambuOutput_counts_gene_validated.txt"
  - counts_transcript_validated:
      type: file
      description: Transcript-level counts validated against novel transcript metadata.
      pattern: "BambuOutput_counts_transcript_validated.txt"
  - cpm_transcript_validated:
      type: file
      description: Transcript-level CPM validated against novel transcript metadata.
      pattern: "BambuOutput_CPM_transcript_validated.txt"
  - full_length_counts_transcript_validated:
      type: file
      description: Full-length transcript counts validated against novel transcript metadata.
      pattern: "BambuOutput_fullLengthCounts_transcript_validated.txt"
  - unique_counts_transcript_validated:
      type: file
      description: Unique transcript counts validated against novel transcript metadata.
      pattern: "BambuOutput_uniqueCounts_transcript_validated.txt"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"

authors:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"
maintainers:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"